# DRAFT by claude-haiku-4-5-20251001 from column profiles of hotel_bookings (no rows were sent). Review every row, add derived
# expressions where needed, check the outcome, then set outcome_confirmed = true.

name = "hotel_bookings_draft"
as_of = "2017-09-15"
test_from = "2017-02-01"
source_url = ""
licence = ""
outcome_confirmed = false
drop_rows_without_created_at = false
features_confirmed = false

[[sources]]
name = "hotel_bookings"
file = "hotel_bookings.csv"

[lead]
created_at = "hotel_bookings.reservation_status_date"

[outcome]
kind = "won_flag"
column = "hotel_bookings.is_canceled"
lost_without_close = "error"
won_values = ["0"]
lost_values = ["1"]

[review]
created_at = { reason = "Earliest date known for booking creation", confidence = "low" }
outcome = { reason = "0=completed booking (won), 1=canceled (lost)", confidence = "high" }

[[fields]]
source = "hotel_bookings.is_canceled"
target = "ignore"
reason = "Outcome variable, not a feature"
confidence = "high"

