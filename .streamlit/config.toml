# Keel (EMVA's internal lead-scoring tool): Streamlit theme. Colours mirror app/theme.py PALETTE.
# Headings use Instrument Serif (page titles, wordmark); section headers set Instrument Sans in app/theme.py.
# One family per font URL: a multi-family URL makes Streamlit drop the whole custom theme (seen on 1.64).
[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 200

[theme]
base = "light"
primaryColor = "#0F5C5A"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#EDEAE3"
textColor = "#1B1F1E"
linkColor = "#0F5C5A"
borderColor = "#E2DDD2"
dataframeBorderColor = "#E2DDD2"
dataframeHeaderBackgroundColor = "#F1EEE8"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 15
font = "Instrument Sans:https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
headingFontWeights = [400, 400, 400, 400, 400, 400]
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#F1EEE8"
redColor = "#B5543C"
orangeColor = "#B7791F"
greenColor = "#0F5C5A"
chartCategoricalColors = ["#0F5C5A", "#C8A36A", "#B5543C", "#6B7F7A", "#1B1F1E"]

[theme.sidebar]
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EEE8"
